stages:
  - test

backend:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r backend/requirements-dev.txt
    - ruff check backend
    - python -m pytest backend/tests

frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run test
    - npm run build
