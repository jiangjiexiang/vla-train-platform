apiVersion: v1
kind: PersistentVolume
metadata:
  name: vla-web-history
  labels:
    app.kubernetes.io/name: vla-train-platform
    app.kubernetes.io/managed-by: vla-train-platform
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem
  # 平台数据统一放在 /data/vla-platform 下。
  # 数据库属主是容器里的 10001（Deployment 的 runAsUser/fsGroup），
  # 迁目录时要 chown 过去，否则容器启动时建不了 WAL 文件。
  hostPath:
    path: /data/vla-platform/history
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vla-web-history
  namespace: vla-platform
  labels:
    app.kubernetes.io/name: vla-train-platform
    app.kubernetes.io/managed-by: vla-train-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
  volumeMode: Filesystem
  volumeName: vla-web-history
