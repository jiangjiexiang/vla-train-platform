# 覆盖 Kueue chart 默认配置。唯一改动：启用 kubeflow.org/pytorchjob 集成。
#
# 背景：Kueue v0.20.5 的 helm chart 默认 values 与官方 release manifests.yaml
# 都把这行注释掉了，只保留 "pod"，导致 Kueue 用 Pod 级集成接管 PyTorchJob
#（Workload 名为 pod-<pod>-<hash>，owner 是 Pod 而不是 PyTorchJob）。
# 单 Master 单 Pod 时看不出问题，但只要作业有多个副本，Kueue 就会逐 Pod 放行。
#
# 本文件由 kueue-0.20.5.tgz 的 values.yaml 抽出 managerConfig 原文，只改这一行生成。
# 用法：helm upgrade --install kueue <chart> -n kueue-system -f 本文件
managerConfig:
  controllerManagerConfigYaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    # enableClusterQueueResources: true
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      groupKindConcurrency:
        Job.batch: 5
        Pod: 5
        Workload.kueue.x-k8s.io: 10
        LocalQueue.kueue.x-k8s.io: 5
        Cohort.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 5
        ResourceFlavor.kueue.x-k8s.io: 1
    clientConnection:
      qps: 300
      burst: 500
    #pprofBindAddress: :8083
    #waitForPodsReady:
    #  timeout: 30m
    #  recoveryTimeout: 5m
    #  unscheduledTimeout: 5m
    #  blockAdmission: false
    #  requeuingStrategy:
    #    timestamp: Eviction
    #    backoffLimitCount: null # null indicates infinite requeuing
    #    backoffBaseSeconds: 60
    #    backoffMaxSeconds: 3600
    #manageJobsWithoutQueueName: true
    # See "Opt-in Namespace Management" for guidance on namespace management:
    # https://kueue.sigs.k8s.io/docs/tasks/manage/enforce_job_management/opt_in_namespace_management/
    #managedJobsNamespaceSelector:
    #  matchExpressions:
    #    - key: kubernetes.io/metadata.name
    #      operator: NotIn
    #      values: [ kube-system, kueue-system ]
    #internalCertManagement:
    #  enable: false
    #  webhookServiceName: ""
    #  webhookSecretName: ""
    integrations:
      frameworks:
      - "batch/job"
      - "kubeflow.org/mpijob"
      - "ray.io/rayjob"
      - "ray.io/rayservice"
      - "ray.io/raycluster"
      - "jobset.x-k8s.io/jobset"
    #  - "kubeflow.org/paddlejob"
      - "kubeflow.org/pytorchjob"
    #  - "kubeflow.org/tfjob"
    #  - "kubeflow.org/xgboostjob"
    #  - "kubeflow.org/jaxjob"
      - "workload.codeflare.dev/appwrapper"
      - "trainer.kubeflow.org/trainjob"
    #  - "sparkoperator.k8s.io/sparkapplication"
      - "pod"
      - "deployment"
      - "statefulset"
      - "leaderworkerset.x-k8s.io/leaderworkerset"
