apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-web
  namespace: vla-platform
  labels:
    app.kubernetes.io/name: vla-train-platform
    app.kubernetes.io/managed-by: vla-train-platform
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    # Recreate：历史库是 hostPath 上的 SQLite（PV/PVC vla-web-history，
    # ReadWriteOnce），同一节点上同时跑两个 Pod 会争抢同一个 database 文件。
    # 单机语义下 Recreate 意味着升级有数秒不可用；需要高可用请叠加
    # deploy/web/overlays/ha（2 副本 + RollingUpdate + PDB + 反亲和）。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-train-platform
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vla-train-platform
        app.kubernetes.io/managed-by: vla-train-platform
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: vla-web
      automountServiceAccountToken: true
      # 拓扑分布：把 Web 副本尽量分散到不同节点。
      #   - DoNotSchedule 只在「有多个候选节点」时才产生硬约束；单机集群里
      #     候选域只有 1 个，第二个副本仍可调度到该节点（不会 Pending），
      #     所以 base 的 replicas=1 与单机部署行为完全不变。
      #   - minDomains: 2 告诉调度器「期望至少 2 个域」，集群只有 1 个节点时
      #     该约束被放宽而不是拒绝调度（详见 Kubernetes 文档
      #     PodTopologySpread / minDomains）。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vla-train-platform
              app.kubernetes.io/component: web
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 用完整仓库路径：containerd 里导入的镜像名就是 docker.io/library/vla-platform，
          # 只写短名会让 kubelet 去远端 registry 拉取（内网被镜像站白名单拒绝，403）。
          image: docker.io/library/vla-platform:local
          # 镜像随部署导入到节点，不需要每次从远端拉
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # optional：auth_mode=off 时不需要令牌；ldap 模式下也不用它。
            # 只有 token 模式必须存在，缺失时由后端启动时报 PLATFORM_API_TOKEN 错误。
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vla-web-auth
                  key: PLATFORM_API_TOKEN
                  optional: true
            # 多用户令牌表（token 模式）。格式 用户名:角色:令牌，逗号分隔。
            # 不配置时退回单一 PLATFORM_API_TOKEN（等价一个 admin）。
            # 之前漏了这一项：Secret 里明明写了，但没引用成环境变量，
            # 于是所有人都走单令牌分支，身份全是同一个 token。
            - name: PLATFORM_USER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: vla-web-auth
                  key: PLATFORM_USER_TOKENS
                  optional: true
            # 本地账号（auth_mode=local）。同样必须显式引用：
            # Secret 里加了 key 不等于 Deployment 会自动注入——
            # 之前就是因为漏了这一行，本地账号配了却登不上，
            # 而服务看起来一切正常。
            - name: PLATFORM_LOCAL_USERS
              valueFrom:
                secretKeyRef:
                  name: vla-web-auth
                  key: PLATFORM_LOCAL_USERS
                  optional: true
            # 默认不要求登录（单机自用的最省事配置）。
            # 正式部署请用 overlay 或 set env 覆盖成 local/token/ldap。
            - name: PLATFORM_AUTH_MODE
              value: off
            - name: PLATFORM_NAMESPACE
              value: vla-training
            - name: PLATFORM_QUEUE
              value: default
            - name: PLATFORM_ALLOWED_GPUS
              value: "1"
            - name: PLATFORM_DEFAULT_IMAGE
              value: vla-smolvla:latest
            - name: PLATFORM_DEFAULT_COMMAND
              value: python /app/train.py
            # 宿主机路径：训练 Pod 的 hostPath 用它。所有产出都在项目 data/ 下。
            # 注意这里踩过一次坑：这些环境变量会**覆盖** config.py 的默认值，
            # 改了代码默认值但忘了改这里，训练 Job 仍然挂到旧路径上，
            # 表现是「数据集明明修好了，训练还是报 KeyError」。
            - name: PLATFORM_DATASET_HOST_PATH
              value: /home/jjx/vla-train-platform/data/datasets
            - name: PLATFORM_CHECKPOINT_HOST_PATH
              value: /home/jjx/vla-train-platform/data/checkpoints
            - name: PLATFORM_DB_PATH
              value: /data/history/platform.db
            - name: PLATFORM_LOG_TAIL_DEFAULT
              value: "500"
            # v0.9：单机默认，多机/配额/LDAP 由 overlay 或 Secret 覆盖。
            - name: PLATFORM_SESSION_TTL_HOURS
              value: "12"
            - name: PLATFORM_MAX_NODES
              value: "1"
            # LDAP 服务账号密码只从 Secret 读；非 ldap 模式不建该 Secret 也能启动。
            - name: PLATFORM_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vla-web-ldap
                  key: PLATFORM_LDAP_BIND_PASSWORD
                  optional: true
          volumeMounts:
            # 历史库（SQLite）。宿主机落在 <项目>/data/history，经 PV
            # vla-web-history 挂进来——平台的所有产出都在项目目录下，
            # 主机上不再留 /data/vla-platform。容器内路径保持不变，
            # 所以 PLATFORM_DB_PATH 与 config 默认值都不用改。
            - name: history
              mountPath: /data/history
            - name: tmp
              mountPath: /tmp
            # 数据集目录：Web 需要它才能扫描并列出可选数据集。
            # 与训练 Pod 使用同一个宿主机路径，保证「列表里看到的」就是「训练时挂进去的」。
            - name: datasets
              mountPath: /datasets
              readOnly: true
            # checkpoint 目录：Web 从这里读 metrics.jsonl、events、权重清单，
            # **并且**要能删——平台自带「清理历史 checkpoint」
            # （POST /api/v1/maintenance/cleanup?include_checkpoints=true），
            # 实现在 Web 容器内对 /checkpoints/<任务名> 做 rmtree。
            # 挂载点与训练 Pod 保持一致（/checkpoints），这样同一份配置
            # 在两边都成立，不用记「宿主机路径和容器路径同名」这种别扭的约定。
            #
            # 为什么不是只读：只读会让清理**静默失败**——K8s 对象和历史记录已删，
            # checkpoint 却 rmtree 不了，用户以为删干净了，磁盘还在涨。
            # 这比不提供该功能更糟（与 0.9 的「只读保护」相反，是有意为之）。
            # 风险由代码侧兜住：删除路径一律过 safe_job_dir()——空值、通配符、
            # 路径分隔符、`..` 与软链接逃逸、以及根目录本身全部拒绝。
            # 数据集仍然只读：Web 从不需要写数据集。
            - name: checkpoints
              mountPath: /checkpoints
              readOnly: false
            # ---- 代码挂载（迭代模式）----
            #
            # 代码不再只存在于镜像里，而是从宿主机目录挂进来。改一行 Python 只需
            # rollout restart（约 10 秒），不用重建镜像 + 导入 K3s（2-10 分钟）。
            # 之前每修一个 bug 都要走完整构建链路，一天大半时间在等构建。
            #
            # 代价：镜像不再自包含，拿去做别的机器跑会缺代码；宿主机和容器里
            # 的代码必须一致。这是「迭代模式」的配置，发正式版应该打完整镜像。
            - name: app-code
              mountPath: /app/app
              readOnly: true
            - name: recipes
              mountPath: /app/recipes
              readOnly: true
            # 前端产物。前端改完仍要 npm run build（约 20 秒），但不用重建镜像。
            - name: static
              mountPath: /app/static
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: datasets
          hostPath:
            path: /home/jjx/vla-train-platform/data/datasets
            type: Directory
        - name: checkpoints
          hostPath:
            path: /home/jjx/vla-train-platform/data/checkpoints
            type: Directory
        # ---- 代码挂载（迭代模式）----
        # 代码从宿主机挂进来，改完 rollout restart 就生效（约 10 秒），
        # 不用重建镜像 + 导入 K3s。见 volumeMounts 处的说明。
        - name: app-code
          hostPath:
            path: /home/jjx/vla-train-platform/backend/app
            type: Directory
        - name: recipes
          hostPath:
            path: /home/jjx/vla-train-platform/recipes
            type: Directory
        # 前端产物。前端仍要 npm run build（约 20 秒），但不用重建镜像。
        - name: static
          hostPath:
            path: /home/jjx/vla-train-platform/frontend/dist
            type: DirectoryOrCreate
        - name: history
          persistentVolumeClaim:
            claimName: vla-web-history
        - name: tmp
          emptyDir: {}
