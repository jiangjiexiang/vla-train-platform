apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-web
  namespace: vla-platform
  labels:
    app.kubernetes.io/name: vla-train-platform
    app.kubernetes.io/managed-by: vla-train-platform
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-train-platform
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vla-train-platform
        app.kubernetes.io/managed-by: vla-train-platform
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: vla-web
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: vla-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # optional：auth_mode=off 时不需要令牌；ldap 模式下也不用它。
            # 只有 token 模式必须存在，缺失时由后端启动时报 PLATFORM_API_TOKEN 错误。
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vla-web-auth
                  key: PLATFORM_API_TOKEN
                  optional: true
            - name: PLATFORM_AUTH_MODE
              value: token
            - name: PLATFORM_NAMESPACE
              value: vla-training
            - name: PLATFORM_QUEUE
              value: default
            - name: PLATFORM_ALLOWED_GPUS
              value: "1"
            - name: PLATFORM_DEFAULT_IMAGE
              value: vla-smoke:latest
            - name: PLATFORM_DEFAULT_COMMAND
              value: python /app/train.py
            - name: PLATFORM_DATASET_HOST_PATH
              value: /data/vla-platform/datasets
            - name: PLATFORM_CHECKPOINT_HOST_PATH
              value: /data/vla-platform/checkpoints
            - name: PLATFORM_DB_PATH
              value: /data/history/platform.db
            - name: PLATFORM_LOG_TAIL_DEFAULT
              value: "500"
            # v0.9：单机默认，多机/配额/LDAP 由 overlay 或 Secret 覆盖。
            - name: PLATFORM_SESSION_TTL_HOURS
              value: "12"
            - name: PLATFORM_MAX_NODES
              value: "1"
            # LDAP 服务账号密码只从 Secret 读；非 ldap 模式不建该 Secret 也能启动。
            - name: PLATFORM_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vla-web-ldap
                  key: PLATFORM_LDAP_BIND_PASSWORD
                  optional: true
          volumeMounts:
            - name: history
              mountPath: /data/history
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: vla-web-history
        - name: tmp
          emptyDir: {}
