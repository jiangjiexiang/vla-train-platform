apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vla-web
  namespace: vla-platform
  labels:
    app.kubernetes.io/name: vla-train-platform
    app.kubernetes.io/managed-by: vla-train-platform
    app.kubernetes.io/component: web
spec:
  # 选择器与 Deployment 保持一致，只保护 Web 自身的 Pod，不影响训练 Pod。
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-train-platform
      app.kubernetes.io/component: web
  # 官方文档 recommended：maxUnavailable: 0 = 「不阻塞节点排空」。
  # 单机副本数为 1 时，部署侧（kustomization.yaml）会把它改成 1，
  # 因为 1 个副本 + maxUnavailable: 0 在单机构成「不可排空」。
  maxUnavailable: 0