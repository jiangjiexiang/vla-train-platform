apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-web
  namespace: vla-platform
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            # 4090 内网单机默认免登录。PLATFORM_AUTH_MODE 优先于
            # PLATFORM_AUTH_REQUIRED，两者都写是为了让老版本镜像回退时行为一致。
            #
            # 免登录的代价必须说清楚：此时**所有访问者都是 admin**，
            # 能提交任务、取消他人的任务、改配额；审计里只能记到来源 IP。
            # NodePort 让局域网任何机器都能访问，所以它只适合完全可信的内网。
            #
            # 需要多人共用或有外网暴露时，把覆盖清单里的值改成 token：
            #   kubectl -n vla-platform set env deploy/vla-web PLATFORM_AUTH_MODE=token
            # 然后按 docs/auth.md 分发访问令牌。
            - name: PLATFORM_AUTH_MODE
              value: "off"
            - name: PLATFORM_AUTH_REQUIRED
              value: "false"
