# 用 Docker 运行平台。注意：Web 需要访问 Kubernetes API，
# 因此下面的 kubeconfig 必须指向容器内可达的 apiserver（不能是 127.0.0.1）。
#
#   docker compose up -d web          # 启动 Web，监听 30080
#   docker compose run --rm test      # 在容器里跑前后端单元测试（不需要集群）
#   docker compose build              # 只构建镜像

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vla-platform:local
    ports:
      - "30080:8000"
    environment:
      PLATFORM_AUTH_REQUIRED: "false"
      PLATFORM_NAMESPACE: "vla-training"
      PLATFORM_QUEUE: "default"
      PLATFORM_ALLOWED_GPUS: "1"
      PLATFORM_DEFAULT_IMAGE: "vla-smoke:latest"
      PLATFORM_DB_PATH: "/data/history/platform.db"
      PLATFORM_KUBECONFIG: "/kube/config"
      PLATFORM_GPU_METRICS_URL: "http://vla-gpu-metrics:8080/"
    volumes:
      - vla-history:/data/history
      # 把可用的 kubeconfig 放到 ./docker/kubeconfig 后取消注释
      # - ./docker/kubeconfig:/kube/config:ro
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    image: vla-platform-test:local
    profiles: ["test"]
    environment:
      VENV_DIR: "/opt/venv"
    command: ["bash", "scripts/test.sh"]

volumes:
  vla-history:
