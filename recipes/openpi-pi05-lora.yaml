id: openpi-pi05-lora
name: π0.5 LoRA 微调
description: openpi π0.5 的 LoRA 微调。注意 openpi 只支持 LeRobot v2.0/v2.1，v3.0 数据集需先用 lerobot 的迁移脚本转换。
image: openpi-pi05:latest
entrypoint: python /opt/openpi/scripts/train.py
dataset_formats:
  - lerobot-v2.1
  - lerobot-v2.0
# 参数名按 tyro 风格（中划线），来自 openpi 实际 --help 输出
template:
  schema_version: 1
  params:
    - key: config_name
      flag: --config.name
      label: 训练配置
      type: enum
      default: pi05_droid
      options: [pi05_droid, pi05_aloha, pi05_libero, pi05_aloha_pen_uncap]
      required: true
      help: 决定模型结构与数据变换，选错会维度不匹配
    - key: exp_name
      flag: --exp-name
      label: 实验名
      type: str
      default: null
      placeholder: 输出到 /checkpoints/<任务名>/<实验名>/
      required: true
    - key: num_train_steps
      flag: --num-train-steps
      label: 训练步数
      type: int
      default: 30000
      min: 1
    - key: batch_size
      flag: --batch-size
      label: batch size
      type: int
      default: 8
      min: 1
      max: 256
      help: 4090 只能跑 LoRA；全量需 >70GB
    - key: peak_lr
      flag: --peak-lr
      label: 峰值学习率
      type: float
      default: 0.00005
      placeholder: 如 5e-5
    - key: save_interval
      flag: --save-interval
      label: 保存间隔（步）
      type: int
      default: 5000
      min: 1
    - key: log_interval
      flag: --log-interval
      label: 日志间隔（步）
      type: int
      default: 100
      min: 1
    - key: overwrite
      flag: --overwrite
      label: 覆盖已有输出
      type: bool
      default: false
      help: 有破坏性，会删除同名输出目录
    - key: resume
      flag: --resume
      label: 断点续训
      type: bool
      default: false
    - key: wandb_enabled
      flag: --wandb-enabled
      label: 上报 W&B
      type: bool
      default: false
defaults:
  num_train_steps: 30000
  batch_size: 8
  peak_lr: 0.00005
gpu_count: 1
# 官方 README 给的是「LoRA 微调 > 22.5 GB」，那是**下界且不含 batch 增量**。
# 本配方默认 batch 8，实际会更高；取 30 作为规划值，宁可高估也不要让用户
# 以为 24 GB 够用。pi05 对 XLA_PYTHON_CLIENT_MEM_FRACTION 很敏感，
# 静态单值天然偏保守才安全。注意：这些数字未经实测（手上没有空闲 GPU）。
estimated_vram_gb: 30
order: 20
public: true
