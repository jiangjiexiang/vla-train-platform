id: rlinf-ppo-lingbotvlav2-robotwin
name: RLinf PPO（LingBotVLA 2.0 / RoboTwin）
description: >-
  用 RLinf v2 对 LingBotVLA 2.0 做 PPO 强化学习（RoboTwin 2.0 Click Bell，lingbotvlav2 环境）。
  默认使用宿主机 /models/lingbotvla/lingbot-vla-v2-6b-robotwin 与 Qwen3-VL-4B-Instruct。
  PPO 不使用数据集，提交时任选占位。
image: docker.io/library/rlinf:embodied-full-v2
entrypoint: >-
  source switch_env lingbotvlav2 &&
  bash /yyl/jiangjiexiang/runtime/nvidia-550.90.07/with_graphics.sh
  python /workspace/RLinf/examples/embodiment/train_embodied_agent.py
  --config-path /workspace/RLinf/examples/embodiment/config
  --config-name robotwin_click_bell_ppo_lingbotvlav2
  runner.logger.log_path=/checkpoints/${JOB_NAME}
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
env:
  ROBOT_PLATFORM: ALOHA
  ROBOTWIN_PATH: /opt/RoboTwin
  ROBOTWIN_ASSETS_PATH: /opt/RoboTwin
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl
  PYTHONPATH: /workspace/RLinf:/opt/RoboTwin
  EMBODIED_PATH: /workspace/RLinf/examples/embodiment
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
host_paths:
  - name: models
    host_path: /models
    mount_path: /models
    read_only: true
  - name: rlinf-v2
    host_path: /yyl/jiangjiexiang/vla-train/RLinf-v2
    mount_path: /workspace/RLinf
    read_only: false
  - name: robotwin
    host_path: /yyl/jiangjiexiang/training_code/RoboTwin
    mount_path: /opt/RoboTwin
    read_only: false
  - name: nvidia-graphics
    host_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    mount_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    read_only: true
template:
  schema_version: 1
  params:
    - key: actor_model_path
      flag: actor.model.model_path=
      label: Actor 模型权重路径
      type: str
      default: /models/lingbotvla/lingbot-vla-v2-6b-robotwin
    - key: rollout_model_path
      flag: rollout.model.model_path=
      label: Rollout 模型权重路径
      type: str
      default: /models/lingbotvla/lingbot-vla-v2-6b-robotwin
    - key: use_reward_model
      flag: reward.use_reward_model=
      label: 启用独立 Reward Model
      type: bool
      default: false
      true_value: "True"
      false_value: "False"
      help: 关闭时使用仿真环境自带奖励；开启时需配合 reward model 配置
    - key: reward_type
      flag: algorithm.reward_type=
      label: Reward 粒度
      type: enum
      options: ["chunk_level", "step_level"]
      default: chunk_level
    - key: reward_coef
      flag: algorithm.reward_coef=
      label: Reward 缩放系数
      type: float
      default: 1.0
    - key: adv_type
      flag: algorithm.adv_type=
      label: 优势估计方法
      type: enum
      options: ["gae", "grpo"]
      default: gae
    - key: kl_beta
      flag: algorithm.kl_beta=
      label: KL 惩罚系数 (kl_beta)
      type: float
      default: 0.0
    - key: num_envs
      flag: env.train.total_num_envs=
      label: 并行仿真环境数
      type: int
      default: 64
      min: 1
      max: 512
    - key: global_batch_size
      flag: actor.global_batch_size=
      label: Global Batch Size
      type: int
      default: 128
      min: 1
    - key: max_steps
      flag: runner.max_steps=
      label: 最大训练步数
      type: int
      default: 30000
      min: 1
    - key: save_interval
      flag: runner.save_interval=
      label: 保存间隔（步）
      type: int
      default: 5000
      min: 1
    - key: extra_args
      kind: extra
      type: str
      label: 其他 Hydra 参数
      default: ""
  extra_args:
    label: 其他 Hydra 参数
    help: 可追加如 env.eval.total_num_envs=4 等 Hydra 覆盖参数
    default: ""
defaults:
  actor_model_path: /models/lingbotvla/lingbot-vla-v2-6b-robotwin
  rollout_model_path: /models/lingbotvla/lingbot-vla-v2-6b-robotwin
  use_reward_model: false
  reward_type: chunk_level
  reward_coef: 1.0
  adv_type: gae
  kl_beta: 0.0
  num_envs: 64
  global_batch_size: 128
  max_steps: 30000
  save_interval: 5000
gpu_count: 8
estimated_vram_gb: 48
order: 33
public: true
