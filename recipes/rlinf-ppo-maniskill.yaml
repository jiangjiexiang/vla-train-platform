id: rlinf-ppo-maniskill
name: RLinf PPO（OpenVLA-OFT / ManiSkill）
description: >-
  用 RLinf v2 在 ManiSkill 仿真里做 PPO 强化学习（OpenVLA-OFT，openvla-oft 环境）。
  使用宿主机挂载的 RLinf-OpenVLAOFT-ManiSkill-Base-Main 权重。
  PPO 是仿真在线采样训练，不使用数据集，提交时任选占位即可。
image: docker.io/library/rlinf:embodied-full-v2
entrypoint: >-
  source switch_env openvla-oft &&
  bash /yyl/jiangjiexiang/runtime/nvidia-550.90.07/with_graphics.sh
  python /workspace/RLinf/examples/embodiment/train_embodied_agent.py
  --config-path /workspace/RLinf/examples/embodiment/config
  --config-name maniskill_ppo_openvlaoft_quickstart
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
env:
  ROBOT_PLATFORM: LIBERO
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl
  PYTHONPATH: /workspace/RLinf
  EMBODIED_PATH: /workspace/RLinf/examples/embodiment
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
host_paths:
  - name: models
    host_path: /models
    mount_path: /models
    read_only: true
  - name: rlinf-v2
    host_path: /yyl/jiangjiexiang/vla-train/RLinf-v2
    mount_path: /workspace/RLinf
    read_only: false
  - name: nvidia-graphics
    host_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    mount_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    read_only: true
template:
  schema_version: 1
  params:
    - key: extra_args
      kind: extra
      type: str
      label: Hydra 覆盖参数
      default: >-
        runner.logger.log_path=/checkpoints/${JOB_NAME}
        actor.model.model_path=/models/openvla-oft/RLinf-OpenVLAOFT-ManiSkill-Base-Main
        rollout.model.model_path=/models/openvla-oft/RLinf-OpenVLAOFT-ManiSkill-Base-Main
        runner.max_steps=200
        runner.save_interval=40
  extra_args:
    label: Hydra 覆盖参数
    help: 可覆盖 runner.max_steps、env.train.total_num_envs、actor.model.model_path 等 Hydra 参数
    default: >-
      runner.logger.log_path=/checkpoints/${JOB_NAME}
      actor.model.model_path=/models/openvla-oft/RLinf-OpenVLAOFT-ManiSkill-Base-Main
      rollout.model.model_path=/models/openvla-oft/RLinf-OpenVLAOFT-ManiSkill-Base-Main
      runner.max_steps=200
      runner.save_interval=40
gpu_count: 1
estimated_vram_gb: 32
order: 30
public: true
