id: rlinf-ppo-pi05-robocasa
name: RLinf PPO（OpenPI / RoboCasa365）
description: >-
  用 RLinf v2 对 OpenPI 做 PPO 强化学习（RoboCasa365 OpenDrawer 仿真，openpi-robocasa365 环境）。
  默认使用宿主机挂载的 /models/openpi/base_models/pi05_base，可在 Hydra 参数中替换为对应任务的 SFT checkpoint。
  PPO 不使用数据集，提交时任选占位。
image: docker.io/library/rlinf:embodied-full-v2
entrypoint: >-
  source switch_env openpi-robocasa365 &&
  bash /yyl/jiangjiexiang/runtime/nvidia-550.90.07/with_graphics.sh
  python /workspace/RLinf/examples/embodiment/train_embodied_agent.py
  --config-path /workspace/RLinf/examples/embodiment/config
  --config-name robocasa365_opendrawer_ppo_openpi
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
env:
  ROBOT_PLATFORM: LIBERO
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl
  PYTHONPATH: /workspace/RLinf
  EMBODIED_PATH: /workspace/RLinf/examples/embodiment
  ROBOCASA365_OPENPI_CKPT: /models/openpi/base_models/pi05_base
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
host_paths:
  - name: models
    host_path: /models
    mount_path: /models
    read_only: true
  - name: rlinf-v2
    host_path: /yyl/jiangjiexiang/vla-train/RLinf-v2
    mount_path: /workspace/RLinf
    read_only: false
  - name: nvidia-graphics
    host_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    mount_path: /yyl/jiangjiexiang/runtime/nvidia-550.90.07
    read_only: true
template:
  schema_version: 1
  params:
    - key: extra_args
      kind: extra
      type: str
      label: Hydra 覆盖参数
      default: >-
        runner.logger.log_path=/checkpoints/${JOB_NAME}
        runner.max_steps=200
        runner.save_interval=40
  extra_args:
    label: Hydra 覆盖参数
    help: 可覆盖 runner.max_steps、actor.model.model_path、rollout.model.model_path 等 Hydra 参数
    default: >-
      runner.logger.log_path=/checkpoints/${JOB_NAME}
      runner.max_steps=200
      runner.save_interval=40
gpu_count: 1
estimated_vram_gb: 36
order: 31
public: true
