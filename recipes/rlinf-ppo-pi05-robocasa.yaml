id: rlinf-ppo-pi05-robocasa
name: RLinf PPO（pi05 / RoboCasa365）
description: >-
  用 RLinf v0.4 对 pi05 做 PPO 强化学习（RoboCasa365 LoadDishwasher 仿真，openpi 环境）。
  镜像内自包含模型权重与仿真资产，模型路径统一为 /trainingworkspace/_models。
  默认热启动 pi05_global_step_20000（RoboCasa SFT ckpt）。PPO 不使用数据集，提交时任选占位。
image: vla-rlinf:0.5-selfcontained
entrypoint: bash /usr/local/bin/run_ppo.sh
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
env:
  RLINF_ENV: openpi
  ROBOCASA365_OPENPI_CKPT: /trainingworkspace/_models/pi05_global_step_20000
template:
  schema_version: 1
  params:
    - key: config
      flag: --config
      label: RLinf 配置名
      type: str
      default: robocasa365_loaddishwasher_ppo_openpi_pi05
      help: 默认匹配已内置的 pi05 LoadDishwasher SFT；其它任务需确认模型输入维度和归一化统计
    - key: model_path
      flag: --model-path
      label: 模型权重路径（留空用环境变量）
      type: str
      default: ""
      help: 默认留空，走 ROBOCASA365_OPENPI_CKPT=/trainingworkspace/_models/pi05_global_step_20000
    - key: max_steps
      flag: --max-steps
      label: 最大训练步数
      type: int
      default: 200
      min: 1
      help: 冒烟验证用 200；正式训练按需调大，-1 表示不限
    - key: save_interval
      flag: --save-interval
      label: 保存 checkpoint 间隔（epoch）
      type: int
      default: 40
      min: 1
    - key: num_envs
      flag: --num-envs
      label: 并行仿真环境数
      type: int
      default: 32
      min: 1
      max: 256
    - key: placement
      flag: --placement
      label: GPU 分配（component_placement）
      type: str
      default: actor,env,rollout:0-0
      help: 单卡保持默认；双卡可改 actor,env,rollout:0-1
defaults:
  config: robocasa365_loaddishwasher_ppo_openpi_pi05
  max_steps: 200
  save_interval: 40
  num_envs: 32
gpu_count: 1
order: 31
public: true
