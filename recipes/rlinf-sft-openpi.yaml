id: rlinf-sft-openpi
name: RLinf SFT（OpenPI π0.5）
description: >-
  用 RLinf v2 对 OpenPI π0.5 做全参数 SFT 微调（openpi 环境）。
  自动挂载平台选中的数据集（${DATASET_ROOT}），默认基座权重 /models/openpi/base_models/pi05_base。
image: docker.io/library/rlinf:embodied-full-v2
entrypoint: >-
  source switch_env openpi &&
  python /workspace/RLinf/examples/sft/train_vla_sft.py
  --config-path /workspace/RLinf/examples/sft/config
  --config-name custom_sft_openpi
  runner.logger.log_path=/checkpoints/${JOB_NAME}
  data.train_data_paths=${DATASET_ROOT}
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
env:
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl
  PYTHONPATH: /workspace/RLinf
  EMBODIED_PATH: /workspace/RLinf/examples/sft
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
host_paths:
  - name: models
    host_path: /models
    mount_path: /models
    read_only: true
  - name: rlinf-v2
    host_path: /yyl/jiangjiexiang/vla-train/RLinf-v2
    mount_path: /workspace/RLinf
    read_only: false
template:
  schema_version: 1
  params:
    - key: model_path
      flag: actor.model.model_path=
      label: 基座模型路径
      type: str
      default: /models/openpi/base_models/pi05_base
    - key: micro_batch_size
      flag: actor.micro_batch_size=
      label: Micro Batch Size（单卡）
      type: int
      default: 2
      min: 1
    - key: global_batch_size
      flag: actor.global_batch_size=
      label: Global Batch Size
      type: int
      default: 16
      min: 1
    - key: lr
      flag: actor.optim.lr=
      label: 学习率
      type: float
      default: 7.91e-6
    - key: max_steps
      flag: runner.max_steps=
      label: 最大训练步数
      type: int
      default: 1000
      min: 1
    - key: save_interval
      flag: runner.save_interval=
      label: 保存间隔（步）
      type: int
      default: 200
      min: 1
    - key: extra_args
      kind: extra
      type: str
      label: 其他 Hydra 参数
      default: ""
  extra_args:
    label: 其他 Hydra 参数
    help: 可追加其他 Hydra 覆盖参数；模型系列固定为 π0.5
    default: ""
defaults:
  model_path: /models/openpi/base_models/pi05_base
  micro_batch_size: 2
  global_batch_size: 16
  lr: 7.91e-6
  max_steps: 1000
  save_interval: 200
gpu_count: 8
estimated_vram_gb: 36
order: 40
public: true
