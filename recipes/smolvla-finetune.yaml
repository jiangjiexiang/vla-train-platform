id: smolvla-finetune
name: SmolVLA 微调
description: 从 SmolVLA 基座权重微调，适合单卡 4090 的抓取类任务。默认 batch 16（4090 实测约 5.6 GiB）。
image: vla-smolvla:latest
entrypoint: python /app/train_vla.py
dataset_formats:
  - lerobot-v3.0
  - lerobot-v2.1
  - lerobot-v2.0
# 键名与 lerobot 0.4.4 的实际 flag 对应（下划线风格，已实测确认）
template:
  schema_version: 1
  params:
    - key: steps
      flag: --steps
      label: 训练步数
      type: int
      default: 2000
      min: 1
      max: 1000000
      help: 总优化步数；4090 上约 1.5 步/秒
    - key: batch_size
      flag: --batch_size
      label: batch size
      type: int
      default: 16
      min: 1
      max: 128
      help: 4090 实测 bs=16 约 5.6 GiB，bs=64 约 19.5 GiB
    - key: grad_accum
      flag: --gradient_accumulation_steps
      label: 梯度累积
      type: int
      default: 1
      min: 1
      max: 64
      help: 显存不够时用累积放大有效 batch
    - key: save_freq
      flag: --save_freq
      label: 保存 checkpoint 间隔（步）
      type: int
      default: 500
      min: 1
      help: 存到 /checkpoints/<任务名>/，任务结束不删除
    - key: log_freq
      flag: --log_freq
      label: 打印日志间隔（步）
      type: int
      default: 10
      min: 1
    - key: num_workers
      flag: --num_workers
      label: 数据加载进程数
      type: int
      default: 8
      min: 0
      max: 32
      help: 4090 实测瓶颈在 dataloader，建议 8-16
    - key: lr
      flag: --policy.optimizer_lr
      label: 学习率
      type: float
      default: 0.0001
      placeholder: 如 1e-4
    - key: device
      flag: --policy.device
      label: 训练设备
      type: enum
      default: cuda
      options: [cuda, cpu]
    - key: resume
      flag: --resume
      label: 从 checkpoint 续训
      type: bool
      default: false
      help: 开启后读取 <输出目录>/checkpoints/last
defaults:
  steps: 2000
  batch_size: 16
  save_freq: 500
  num_workers: 8
gpu_count: 1
estimated_vram_gb: 12
order: 10
public: true
